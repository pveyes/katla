name: update-word

on:
  schedule:
    # TODO: use new zealand time?
    # Update on every 00:00 GMT+9 / WIT which means 15:00 UTC
    # Also sync timezone change to update.js/TIMEZONE_OFFSET
    - cron: "00 15 * * *"
  # allow running manually to test or recover a missed day
  workflow_dispatch:

# the commit is pushed through the API with GITHUB_TOKEN
permissions:
  contents: write

jobs:
  update_katla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: yarn
      - name: install deps
        run: yarn install --frozen-lockfile
      # pushes a new commit to main; the deploy job below publishes it
      - name: update new word
        run: yarn update
        env:
          SECRET_DATE: ${{ secrets.SECRET_DATE }}
          SECRET_WORD: ${{ secrets.SECRET_WORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: update_katla
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
